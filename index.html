<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android 4.4 APK</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./widgets.css">
    <script src="./script.js"></script>
    <svg style="display: none;">
      <filter id="ie-blur">
        <feGaussianBlur stdDeviation="4" />
      </filter>
    </svg>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stick+No+Bills:wght@200..800&display=swap" rel="stylesheet">
  </head>

<body>
    <div class="widget-raster">
      <div class="container_widget">
        <div class="glass">

          <div class="scroll_container test_green">
            <div class="c50 test_red">

              <div class="inner_c widget_border center">
                <div class="inner_c_text test_orange center">
                  <div class="widget_text font_1">Hallo</div>
                  <input type="range" class="slider">
                </div>
              </div>

            </div>
            <div class="c50">

              <div class="inner_c widget_border">
                <div class="inner_c_text">
                  <div class="widget_text font_1">Hallo</div>
                  <input type="range" class="slider">
                </div>
              </div>

            </div>
            <div class="c50">

              <div class="inner_c widget_border">
                <div class="inner_c_text">
                  <div class="widget_text font_1">Hallo</div>
                  <input type="range" class="slider">
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
      <div class="main_widget">
        <div class="glass"> 
          <div class="main_scroll" id="main_scroll">
            <div class="icon Xtemperature" id="first_main_icon"><div class="temperature"></div></div>
            <div class="icon Xled"><div class="led"></div></div>
            <div class="icon Xtodo"><div class="todo"></div></div>
            <div class="icon Xmusic"><div class="music"></div></div>
            <div class="icon Xsettings" id="last_main_icon"><div class="settings"></div></div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
